apiVersion: apps/v1
kind: Deployment
metadata:
  name: artificial-registry
spec:
  replicas: 2
  selector:
    matchLabels: {app: artificial-registry}
  template:
    metadata:
      labels: {app: artificial-registry}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: registry.example.com/artificial-registry:0.1.0
          ports: [{containerPort: 8080}]
          envFrom:
            - secretRef: {name: artificial-registry-config}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: artificial-registry
spec:
  selector: {app: artificial-registry}
  ports: [{port: 80, targetPort: 8080}]
